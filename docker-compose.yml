services:
  db:
    image: postgres:16-alpine
    container_name: controle-gastos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: gastos
      POSTGRES_DB: controle_gastos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos -d controle_gastos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
